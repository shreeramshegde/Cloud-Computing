name: Deploy Serverless Portfolio to AWS S3 & CloudFront

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  S3_BUCKET_NAME: "shreeram-portfolio-storage-2026"
  AWS_DEFAULT_REGION: "ap-southeast-2"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build React Application
        run: npm run build

      - name: Verify Build Output
        run: |
          test -f dist/index.html || { echo "dist/index.html not generated!"; exit 1; }
          echo "Build verification passed."

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_DEFAULT_REGION }}

      - name: Deploy Static Assets to Amazon S3
        run: |
          echo "Syncing assets to S3 bucket ${{ env.S3_BUCKET_NAME }}..."
          aws s3 sync dist/ s3://${{ env.S3_BUCKET_NAME }} --delete --cache-control "max-age=31536000,public" --exclude "index.html"
          aws s3 cp dist/index.html s3://${{ env.S3_BUCKET_NAME }}/index.html --cache-control "max-age=0,no-cache,no-store,must-revalidate"
          echo "S3 deployment complete."

      - name: Output Live S3 Website URL to Step Summary & Console
        run: |
          WEBSITE_URL="http://${{ env.S3_BUCKET_NAME }}.s3-website-${{ env.AWS_DEFAULT_REGION }}.amazonaws.com"
          echo "========================================================"
          echo "🚀 LIVE S3 WEBSITE URL: ${WEBSITE_URL}"
          echo "========================================================"

          cat <<EOF >> $GITHUB_STEP_SUMMARY
          # 🚀 Deployment Successful!

          Your serverless React broadsheet portfolio has been compiled and deployed directly to **Amazon S3**.

          ### 🌐 Live Website Access
          👉 **[Click Here to Open Your Live Portfolio](${WEBSITE_URL})**

          - **Direct URL**: [${WEBSITE_URL}](${WEBSITE_URL})
          - **AWS S3 Bucket**: \`${{ env.S3_BUCKET_NAME }}\`
          - **AWS Region**: \`${{ env.AWS_DEFAULT_REGION }}\`
          - **Commit**: \`${{ github.sha }}\`
          - **Triggered By**: \`${{ github.actor }}\`
          - **Deployed At**: \`$(date -u +"%Y-%m-%d %H:%M:%S UTC")\`
          EOF

      - name: Invalidate CloudFront Cache (Optional)
        run: |
          if [ -n "${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}" ]; then
            echo "Invalidating CloudFront Distribution ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}..."
            aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"
          else
            echo "CLOUDFRONT_DISTRIBUTION_ID secret not set. Skipping cache invalidation."
          fi
